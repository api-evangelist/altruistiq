- aid: altruistiq:altruistiq-export-api
  name: Altruistiq Export API
  description: >-
    ### Altruistiq’s Export API enables you to:

      - Export corporate data

    Exporting data is a key part of the Altruistiq platform. It allows you to take your data and use it
    in other systems, or to share it with other stakeholders.


    Currently, our Export API allows you to export your Corporate Emissions data available in Altruistiq,
    down to a daily grain. We are working hard to also add Product Emissions data to your Export API.
    If you need to share Product emissions data today, see the PACT API.


