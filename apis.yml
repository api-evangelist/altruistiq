  description: >-
    ### Altruistiq’s datasource API enables you to:

      - Create new datasources
      - Manage existing datasources (read, update)
      - Upload data to a datasource

    A datasource is the place where you will share a single data format with altruistiq and where you
    will categorise it so that we can calculate emissions in an automated way.
