            key2: value2
        downstreamInputType:
          enum:
          - Glass
          - Steel Cans
          - Aluminium Cans
          - Paper
          - PET
          - Rigid Plastic
          - Mixed Plastic
          - LDPE
          - Other
          - CO2 for carbonation
