openapi: 3.2.0
info:
  title: Altruistiq Datasource Product structure inputs API
  x-logo:
    url: ./aq.svg
    altText: Altruistiq Logo
  version: 1.0.0
  description: '# Definitions


    An **Activity** is a business process that has taken place, which is relevant for emissions measurement.'
servers:
- url: https://app.altruistiq.com/
  description: Altruistiq Server
tags:
- name: Product structure inputs
  description: '### Altruistiq’s Product Structure API enables you to:


    - Create new product structure inputs

    - Update existing product structure inputs

    - Delete product structure inputs

    - Get a list of all product structure inputs

    - All the above in bulk against a single product structure


    The product structure input bulk actions are useful for creating and updating product structure inputs in bulk.'
