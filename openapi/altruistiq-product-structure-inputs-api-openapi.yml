components:
  schemas:
    BulkUpdateProductStructureInputsResponse:
      properties:
        success:
          type: boolean
          description: A string boolean about the response
          example: true
      type: object
      required:
      - success
    UpdateProductStructureInputResponse:
      properties:
        success:
          type: boolean
          description: A string boolean about the response
          example: true
      type: object
      required:
      - success
    CreateProductStructureInputQuery:
      properties:
        inputCode:
          type: string
          description: Your identifier for the input.
          example: INPUT-001
        inputName:
          type: string
          description: The descriptive name of the input
          example: Tin sheet
        inputCategory:
          type: string
          description: A category for the input
          example: Metals
        inputSubCategory:
          type: string
          description: A sub-category for the input
          example: Soft metals
        sourceCountry:
          minLength: 2
          type: string
          maxLength: 2
          description: The 2 character country code (ISO 3166-1 alpha-2) for the source country of the input
          example: GB
        supplierName:
          type: string
          description: The name of the supplier that the input is purchased from
          example: Metal Suppliers Ltd
        supplierCountryCode:
          minLength: 2
          type: string
          maxLength: 2
          description: The 2 character country code (ISO 3166-1 alpha-2) for the location of the supplier of the input.
          example: GB
        productOrPackaging:
          enum:
          - PRODUCT
          - PACKAGING
          type: string
          description: Wheter the input is a product or packaging type
          example: PACKAGING
        weight:
          type: number
          description: The weight of the input in one declared unit
          example: '100'
          exclusiveMinimum: 0
        weightUnit:
          type: string
          description: The unit of weight for the input
          example: g
        recyclePercentage:
          type: number
          description: How much of the input comes from recycled content
          example: '50'
        additionalData:
          description: Additional JSON data for the product
          example:
            key1: value1
            key2: value2
      type: object
      required:
      - inputName
      - productOrPackaging
      - weight
      - weightUnit
